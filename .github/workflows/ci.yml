name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: veille_test
          POSTGRES_USER: veille
          POSTGRES_PASSWORD: veille
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veille -d veille_test"
          --health-interval 5s
          --health-retries 10
    env:
      VEILLE_TEST_DATABASE_URL: postgresql+asyncpg://veille:veille@127.0.0.1:5432/veille_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check src tests alembic
      - run: ruff format --check src tests alembic
      - run: pytest -q

  # L'image réellement déployée sur Render : lock des dépendances puis paquet en --no-deps.
  # Un oubli dans requirements.lock (vécu avec httpx le 2026-09-27) casse ici, pas en prod.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t veille-api backend
      - name: L'application s'importe dans l'image
        run: docker run --rm --entrypoint python veille-api -c "from veille.main import app_factory; import veille.cli"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng build --configuration production
      - run: npx ng test --watch=false
