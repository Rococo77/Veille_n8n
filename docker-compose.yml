# Développement local uniquement : en production la base est sur Supabase.
#   docker compose up -d db
#   VEILLE_DATABASE_URL=postgresql+asyncpg://veille:veille@127.0.0.1:5432/veille alembic upgrade head
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veille
      POSTGRES_USER: veille
      POSTGRES_PASSWORD: veille
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - veille-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veille -d veille"]
      interval: 5s
      retries: 10

volumes:
  veille-db:
